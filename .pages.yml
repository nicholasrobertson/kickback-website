# .pages.yml

# --- Media libraries editors can upload to ---
media:
  - name: images
    label: Images
    input: public/images
    output: /images
    categories: [ image ]   # png, jpg, webp, svg, etc.

  - name: docs
    label: Documents
    input: public/files
    output: /files
    categories: [ document, pdf ]  # pdf, docx, etc.

# --- Content definitions ---
content:
  # Home: flexible, ordered blocks
  - name: home
    label: Home
    type: file
    path: content/pages/home.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string, default: "Home" }
      # bools to show/hide sections
      - { name: showMission, label: Show Mission section, type: boolean, default: true }
      - { name: showProjects, label: Show Projects section, type: boolean, default: true }
      - { name: showPartners, label: Show Partners section, type: boolean, default: true }
      - { name: showReports, label: Show Reports section, type: boolean, default: true }
      - { name: showTeam, label: Show Team section, type: boolean, default: true }

  # Mission:
  - name: mission
    label: Mission
    type: file
    path: content/pages/mission.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string, default: "Our Mission" }
      - { name: blurb, label: Blurb, type: rich-text, options: { media: images } }

  # Volunteer
  - name: volunteer
    label: Volunteer
    type: file
    path: content/pages/volunteer.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string, default: "Volunteer" }

  # Team
  - name: team
    label: Team
    type: collection
    path: content/team
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [ name, dept, role, onHomePage, order ]
      primary: name
      sort: [ dept, order, name ]
      default:
        sort: dept
        order: asc
    fields:
      - { name: name,  label: Name, type: string, required: true }
      - { name: role,  label: Role/Title, type: string, required: true }
      - name: dept
        label: Department
        type: select
        options:
          values: [ board, staff, volunteer ]
      - { name: phone, label: Phone, type: string }
      - { name: email, label: Email, type: string }
      - name: photo
        label: Photo
        type: image
        options: { media: images }
      - { name: bio, label: Short Bio, type: text }
      - { name: onHomePage, label: Show on Home, type: boolean, default: false }
      - { name: order, label: Order (lower = earlier), type: number, default: 9999 }
      # social media links repeatable - url and local and alt text
      - name: social
        label: Social Media Links
        type: object
        list: true
        fields:
          - { name: url, label: URL, type: string, required: true }
          - { name: icon, label: Icon, type: image, options: { media: images }, required: true }
          - { name: alt, label: Alt Text (for icon), type: string }
          - { name: order, label: Order (lower = earlier), type: number, default: 9999 }


  # Reports (file or external link) + onHomePage + order
  - name: reports
    label: Reports
    type: collection
    path: content/reports
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [ name, date, onHomePage, order ]
      primary: name
      sort: [ date, order, name ]
      default:
        sort: date
        order: desc
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - name: file
        label: Upload (PDF)
        type: file
        options: { media: docs }
      - { name: link, label: External Link (optional)", type: string }
      - { name: onHomePage, label: Show on Home, type: boolean, default: false }
      - { name: order, label: Order (lower = earlier), type: number, default: 9999 }

  # Projects
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [ title, onHomePage, order ]
      primary: title
      sort: [ order, title ]
      default:
        sort: title
        order: asc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: description
        label: Description
        type: rich-text
        options: { media: images }
      - { name: link, label: Link (internal or external), type: string }
      - { name: onHomePage, label: Show on Home, type: boolean, default: false }
      - { name: order, label: Order (lower = earlier), type: number, default: 9999 }

  # Partners
  - name: partners
    label: Partners
    type: collection
    path: content/partners
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [ name, type, onHomePage, order ]
      primary: name
      sort: [ type, order, name ]
      default:
        sort: name
        order: asc
    fields:
      - { name: name, label: Name, type: string, required: true }
      - name: type
        label: Type
        type: select
        options:
          values: [ seed, corporate, local ]
      - name: logo
        label: Logo
        type: image
        options: { media: images }
      - { name: url, label: Website, type: string }
      - { name: onHomePage, label: Show on Home, type: boolean, default: false }
      - { name: order, label: Order (lower = earlier), type: number, default: 9999 }

# Keep unknown fields in existing files when saving (handy if you hand-edit)
settings:
  content:
    merge: true