# pages.cms.yaml
# Top-level config + all page/content schemas for editors.
# Editors only touch files under pages.cms/

config:
  assets:
    images: public/images
    fonts: public/fonts

# ---- Single-page content (fixed files) ----
singletons:
  home:
    label: "Home"
    files:
      - path: pages.cms/home/hero.yml
        label: "Hero"
        fields:
          - { name: headline, label: "Headline", type: string, required: true }
          - { name: subheadline, label: "Subheadline", type: string }
          - { name: backgroundImage, label: "Background Image", type: image }
          - name: cta
            label: "Call To Action"
            type: object
            fields:
              - { name: label, label: "Button Text", type: string }
              - { name: href,  label: "Target (URL or path)", type: string }
      - path: pages.cms/home/socials.yml
        label: "Socials & Map"
        fields:
          - { name: facebook,  label: "Facebook URL",  type: url }
          - { name: instagram, label: "Instagram URL", type: url }
          - { name: tiktok,    label: "TikTok URL",    type: url }
          - { name: mapsLink,  label: "Google Maps Link", type: url }
      - path: pages.cms/home/highlights.yml
        label: "Highlights"
        fields:
          - name: items
            label: "Highlight Items"
            type: list
            of:
              type: object
              fields:
                - { name: title, label: "Title", type: string, required: true }
                - { name: value, label: "Value (number)", type: number, required: true }

  mission:
    label: "Mission"
    files:
      - path: pages.cms/mission/hero.yml
        label: "Hero"
        fields:
          - { name: image, label: "Hero Image", type: image }
          - { name: title, label: "Title", type: string, required: true }
          - name: cta
            label: "Call To Action"
            type: object
            fields:
              - { name: label, label: "Button Text", type: string }
              - { name: href,  label: "Target (URL or path)", type: string }
      - path: pages.cms/mission/body.mdx
        label: "Body Content"
        fields:
          - { name: body, label: "Body (MDX)", type: markdown }

  volunteer:
    label: "Volunteer"
    files:
      - path: pages.cms/volunteer/info.yml
        label: "Info"
        fields:
          - { name: title, label: "Title", type: string, required: true }
          - { name: blurb, label: "Blurb", type: text }
          - name: cta
            label: "Call To Action"
            type: object
            fields:
              - { name: label, label: "Button Text", type: string }
              - { name: href,  label: "Target (URL or path)", type: string }
      - path: pages.cms/volunteer/form.yml
        label: "Form Schema"
        fields:
          - name: fields
            label: "Fields"
            type: list
            of:
              type: object
              fields:
                - { name: type, label: "Type", type: enum, options: ["text","email","tel","select","textarea"] }
                - { name: name, label: "Name (field key)", type: string, required: true }
                - { name: label, label: "Label", type: string, required: true }
                - { name: required, label: "Required", type: boolean, default: false }
                - { name: options, label: "Options (for select)", type: list, of: { type: string } }
          - name: submit
            label: "Submit"
            type: object
            fields:
              - { name: label,  label: "Button Text", type: string }
              - { name: action, label: "Form Action URL", type: string }

# ---- Collections (one file per item) ----
collections:
  partners:
    label: "Partners"
    path: pages.cms/partners/items
    filename: "{{order | padstart:3}}-{{name | slug}}.yml"
    sort:
      - { by: order, dir: asc }
      - { by: name,  dir: asc }
    fields:
      - { name: name,  label: "Name",  type: string, required: true }
      - { name: type,  label: "Type",  type: enum, options: ["seed","corporate","local"], required: true }
      - { name: logo,  label: "Logo",  type: image }
      - { name: url,   label: "Website", type: url }
      - { name: onHomePage, label: "Show on Home", type: boolean, default: false }
      - { name: order, label: "Order", type: number, default: 9999 }

  reports:
    label: "Reports"
    path: pages.cms/reports/items
    filename: "{{date}}-{{name | slug}}.yml"
    sort:
      - { by: date,  dir: desc }
      - { by: order, dir: asc }
    fields:
      - { name: name, label: "Name", type: string, required: true }
      - { name: date, label: "Date (YYYY-MM-DD)", type: date, required: true }
      - { name: file, label: "File Upload (PDF)", type: file }
      - { name: link, label: "External Link", type: url }
      - { name: onHomePage, label: "Show on Home", type: boolean, default: false }
      - { name: order, label: "Order", type: number, default: 9999 }
    validations:
      - rule: "file || link"
        message: "Provide a file upload or an external link."

  projects:
    label: "Projects"
    path: pages.cms/projects/items
    filename: "{{order | padstart:3}}-{{name | slug}}.yml"
    sort:
      - { by: order, dir: asc }
      - { by: name,  dir: asc }
    fields:
      - { name: name,        label: "Name", type: string, required: true }
      - { name: description, label: "Description", type: text }
      - { name: link,        label: "Link (internal or external)", type: string }
      - { name: onHomePage,  label: "Show on Home", type: boolean, default: false }
      - { name: order,       label: "Order", type: number, default: 9999 }

  team:
    label: "Team"
    path: pages.cms/team/items
    filename: "{{order | padstart:3}}-{{name | slug}}.yml"
    sort:
      - { by: dept,  dir: asc }
      - { by: order, dir: asc }
    fields:
      - { name: name,  label: "Name", type: string, required: true }
      - { name: role,  label: "Role/Title", type: string, required: true }
      - { name: dept,  label: "Department", type: enum, options: ["board","staff","volunteer"], required: true }
      - { name: phone, label: "Phone", type: string }
      - { name: email, label: "Email", type: email }
      - { name: photo, label: "Photo", type: image }
      - { name: bio,   label: "Short Bio", type: text }
      - { name: onHomePage, label: "Show on Home", type: boolean, default: false }
      - { name: order, label: "Order", type: number, default: 9999 }
